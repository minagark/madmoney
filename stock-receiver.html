<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mad Money Receiver</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
        }

        #status {
            font-weight: bold;
            margin-bottom: 30px;
        }

        #symbol {
            font-size: 36px;
            font-weight: bold;
        }

        #price {
            font-size: 64px;
            margin: 20px 0;
        }

        #json {
            margin-top: 30px;
            background: #eee;
            padding: 15px;
            white-space: pre;
        }
    </style>
</head>

<body>

<h1>Mad Money Stock Receiver</h1>

<p id="status">Connecting...</p>

<div id="symbol">Waiting...</div>

<div id="price"></div>

<div id="timestamp"></div>

<div id="json"></div>

<script>

    const socketUrl =
        "ws://10.23.131.137:8099/madmoney";

    const socket = new WebSocket(socketUrl);

    socket.onopen = function () {
        document.getElementById("status").textContent =
            "Connected to " + socketUrl;
    };

    socket.onclose = function () {
        document.getElementById("status").textContent =
            "Disconnected";
    };

    socket.onerror = function () {
        document.getElementById("status").textContent =
            "WebSocket error";
    };

    socket.onmessage = function (event) {

        const stock = JSON.parse(event.data);

        if (stock.type !== "STOCK_PRICE") {
            return;
        }

        document.getElementById("symbol").textContent =
            stock.symbol;

        document.getElementById("price").textContent =
            "$" + stock.price.toFixed(2);

        document.getElementById("timestamp").textContent =
            stock.timestamp;

        document.getElementById("json").textContent =
            JSON.stringify(stock, null, 2);
    };

</script>

</body>
</html>
