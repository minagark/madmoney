<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mad Money Stock Sender</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 150px;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
        }

        #status {
            font-weight: bold;
            margin-bottom: 20px;
        }

        #message {
            background: #eee;
            padding: 15px;
            margin-top: 20px;
            white-space: pre;
        }
    </style>
</head>

<body>

<h1>Mad Money Stock Sender</h1>

<p id="status">Connecting...</p>

<label>
    Symbol:
    <input id="symbol" value="NVDA">
</label>

<br>

<label>
    Price:
    <input id="price" type="number" step="0.01" value="180.25">
</label>

<br>

<button onclick="sendStockPrice()">Send Stock Price</button>

<div id="message"></div>

<script>

    const socketUrl =
        "ws://localhost:8088/madmoney";

    const socket = new WebSocket(socketUrl);

    socket.onopen = function () {
        document.getElementById("status").textContent =
            "Connected to " + socketUrl;
    };

    socket.onclose = function () {
        document.getElementById("status").textContent =
            "Disconnected";
    };

    socket.onerror = function () {
        document.getElementById("status").textContent =
            "WebSocket error";
    };

    function sendStockPrice() {

        const stock = {
            type: "STOCK_PRICE",
            symbol: document.getElementById("symbol").value
        };

        const json = JSON.stringify(stock);

        socket.send(json);

        document.getElementById("message").textContent =
            "Sent:\n\n" +
            JSON.stringify(stock, null, 2);
    }

</script>

</body>
</html>
